<!DOCTYPE html>
<html>
<head>
    <title>Zoho Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
        }

        .container {
            padding: 20px;
        }

        .title {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            width: 220px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-title {
            font-size: 14px;
            color: #94a3b8;
        }

        .card-value {
            font-size: 26px;
            margin-top: 10px;
            color: #38bdf8;
            font-weight: bold;
        }

        .card:hover {
            transform: scale(1.03);
            transition: 0.2s;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title">Analytics Dashboard</div>
    <div class="subtitle">Simple Zoho-style UI built with HTML + CSS</div>

    <div class="cards">

        <div class="card">
            <div class="card-title">Revenue</div>
            <div class="card-value">₹50,000</div>
        </div>

        <div class="card">
            <div class="card-title">Users</div>
            <div class="card-value">1,200</div>
        </div>

        <div class="card">
            <div class="card-title">Orders</div>
            <div class="card-value">320</div>
        </div>

        <div class="card">
            <div class="card-title">Conversion Rate</div>
            <div class="card-value">4.8%</div>
        </div>

    </div>

</div>

</body>
</html>
